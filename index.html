<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a120d">
  <title>Harvest Menu 2026</title>
  <meta name="description" content="Harvest Menu 2026 — Mains, Sides, and Dessert.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Harvest Menu 2026">
  <meta property="og:description" content="Harvest Menu 2026 — Mains, Sides, and Dessert.">
  <meta property="og:image" content="https://susanchapas.github.io/friendsgiving26/assets/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Coustard:wght@400;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="sheet">
    <aside class="ink-col">
      <div class="painting-wrap" aria-hidden="true">
        <img class="painting" src="assets/Ink-Wash Thanksgiving Harvest on Black Stone.png" alt="">
      </div>
    </aside>

    <div class="paper" tabindex="0" aria-label="Menu">
      <header class="masthead">
        <h1 class="masthead-title">Harvest Menu</h1>
        <span class="masthead-stroke" aria-hidden="true"></span>
        <p class="masthead-blurb">Every dish is homemade and made fresh, with locally-sourced, <span style="white-space: nowrap">farm-to-table</span> ingredients. Thank you for sharing this feast with us.</p>
        <p class="legend"><span class="tag tag-veg" aria-hidden="true"></span> Vegetarian <span class="tag tag-halal" aria-hidden="true"></span> Halal</p>
      </header>

      <nav class="course-nav" aria-label="Courses"></nav>

      <div id="menu-sections"></div>
    </div>
  </main>

  <canvas class="leaves" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
